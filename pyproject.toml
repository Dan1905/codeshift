[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codeshift-ai"
version = "0.1.0"
description = "AI-assisted sync-to-async migration engine for Python: AST analysis, LibCST rewrites, validated LLM proposals, verification and rollback."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dhanvin Shetty" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "libcst>=1.5",
    "pydantic>=2.7",
    "pathspec>=0.12",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "ruff>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "requests>=2.31",
]

[project.scripts]
codeshift = "codeshift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codeshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/codeshift"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["codeshift"]
