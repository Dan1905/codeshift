# Example: run CodeShift as a build step.
# Migrates a scratch copy of the bundled service (the checkout is never modified),
# requires the migrated code to pass verification including its tests, checks
# that no fixable deprecated APIs remain, and uploads the diff and report.
name: CodeShift build step

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/legacy_service/**"
      - "src/**"
      - ".github/workflows/codeshift-build-step.yml"

permissions:
  contents: read

jobs:
  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CodeShift
        run: pip install -e ".[demo]"
      - name: Prepare a scratch copy and state directory
        run: |
          echo "CODESHIFT_HOME=$RUNNER_TEMP/codeshift-state" >> "$GITHUB_ENV"
          echo "SERVICE=$RUNNER_TEMP/legacy_service" >> "$GITHUB_ENV"
          cp -R examples/legacy_service "$RUNNER_TEMP/legacy_service"
      - name: Plan the migration (offline provider, no API key needed)
        run: codeshift plan "$SERVICE" --llm sample
      - name: Apply to the scratch copy
        run: codeshift apply --yes --non-interactive
      - name: Verify, including the service's tests (must pass)
        run: codeshift verify --run-tests
      - name: Export diff and report
        if: always()
        run: |
          codeshift diff > codeshift.diff || true
          codeshift report --format json --output codeshift-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeshift-proposal
          path: |
            codeshift.diff
            codeshift-report.json
          if-no-files-found: warn
      - name: No fixable deprecated APIs remain after migration
        run: codeshift analyze "$SERVICE" --rules deprecated-api --fail-on-findings
